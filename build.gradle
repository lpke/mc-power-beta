plugins {
    id 'maven-publish'
    id 'fabric-loom' version '1.11.8'
    id 'babric-loom-extension' version '1.11.9'
}
group = 'local.luke'
version = project.mod_version
base.archivesName = 'power-beta'
loom {
    mixin { useLegacyMixinAp = true }
    customMinecraftManifest.set('https://babric.github.io/manifest-polyfill/b1.7.3.json')
    intermediaryUrl.set('https://maven.glass-launcher.net/babric/babric/intermediary/%1$s/intermediary-%1$s-v2.jar')
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.glass-launcher.net/babric' }
}
dependencies {
    compileOnly files('input-api/build/libs/power-beta-input-1.0.0.jar')
    minecraft 'com.mojang:minecraft:b1.7.3'
    mappings 'babric:barn:b1.7.3+build.8:v2'
    modImplementation 'babric:fabric-loader:0.15.6-babric.2'
    modCompileOnly files('vendor/jars/GlassConfigAPI-3.2.5.jar', 'source-build/build/power_controls/libs/power_controls-0.31.0+powerbeta.1.jar')
    modCompileOnly fileTree('build/platform-compile') { include '*.jar' }
    compileOnly 'com.google.code.gson:gson:2.8.9'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation files('vendor/libraries/Simple-Yaml-1.8.4.jar','input-api/build/libs/power-beta-input-1.0.0.jar')
    testImplementation 'com.google.code.gson:gson:2.8.9'
}
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.ow2.asm' && requested.name == 'asm-all') useVersion '4.1'
    }
}
// These are locally compiled modules. Module coordinates give Loom stable nested IDs.
def utilityModules = new groovy.json.JsonSlurper().parse(file('source-build/modules.json'))
repositories {
    flatDir {
        dirs utilityModules.keySet().collect { "source-build/build/${it}/libs" }
        dirs 'modules/creative/build/libs', 'modules/building/build/libs',
             'modules/worldedit/build/libs', 'vendor/libraries'
    }
}
dependencies {
    utilityModules.each { id, spec ->
        if (spec.enabled) include "local.powerbeta:${id}:${spec.version}+powerbeta.1"
    }
    include 'local.powerbeta:power_creative:1.1.0'
    include 'local.powerbeta:power_building:1.2.1'
    include 'local.powerbeta:power-worldedit:1.2.1'
    include 'blue.endless:jankson:1.2.1'
    include 'local.powerbeta:Simple-Yaml:1.8.4'
    include 'com.google.guava:guava:33.2.1-jre'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { withSourcesJar() }
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

jar {
    from('LICENSE')
    from(zipTree(file('input-api/build/libs/power-beta-input-1.0.0.jar'))) { exclude 'META-INF/MANIFEST.MF' }
}
test { classpath += files('input-api/build/libs/power-beta-input-1.0.0.jar') }
