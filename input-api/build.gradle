plugins { id 'java-library' }
group = 'local.luke.power'
version = '1.0.0'
repositories { mavenCentral() }
dependencies {
    compileOnly('org.lwjgl.lwjgl:lwjgl:2.9.3') { transitive = false }
    compileOnly 'com.google.code.gson:gson:2.8.9'
    testImplementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
java { withSourcesJar() }
test { useJUnitPlatform() }
processTestResources {
    from('../modules/controls/src/main/resources') { include 'assets/power_controls/panoramas.json' }
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

ext.texturePackRoot = rootDir.parentFile
ext.textureProject = 'input-api'
apply from: new File(texturePackRoot, 'gradle/texture-assets.gradle')
