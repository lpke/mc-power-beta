plugins {
    id 'maven-publish'
    id 'fabric-loom' version '1.11.8'
    id 'babric-loom-extension' version '1.11.9'
}

group = 'local.luke'
version = project.mod_version
base.archivesName = 'lpketweaks'

loom {
    mixin { useLegacyMixinAp = true }
    customMinecraftManifest.set('https://babric.github.io/manifest-polyfill/b1.7.3.json')
    intermediaryUrl.set('https://maven.glass-launcher.net/babric/babric/intermediary/%1$s/intermediary-%1$s-v2.jar')
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.glass-launcher.net/babric' }
}

dependencies {
    compileOnly files('../../input-api/build/libs/power-beta-input-1.0.0.jar')
    minecraft 'com.mojang:minecraft:b1.7.3'
    mappings 'babric:barn:b1.7.3+build.8:v2'
    modImplementation 'babric:fabric-loader:0.15.6-babric.2'

    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.17.1'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java { withSourcesJar() }
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar { from('LICENSE'); from('NOTICE'); from('licenses') { into 'META-INF/licenses' } }

configurations.configureEach { resolutionStrategy.eachDependency { if (requested.group == "org.ow2.asm" && requested.name == "asm-all") useVersion "4.1" } }
